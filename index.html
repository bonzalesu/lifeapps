<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食費実績</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.min.css">
</head>
<style>
    body {
      font-family: sans-serif;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    
    .number-input {
      display: flex;
      align-items: center;
    }
    
    .number-input input[type="text"] {
      flex-grow: 1;
      text-align: left;
    }
    
    .number-input button {
      width: 30px;
      height: 30px;
      border: none;
      background-color: #eee;
      cursor: pointer;
      font-size: 16px;
    }
    
    .number-input button:hover {
      background-color: #ddd;
    }
    
    .date-input {
      position: relative;
    }
    
    .date-input input[type="text"] {
      padding-right: 40px;
    }
    
    .date-input button {
      position: absolute;
      right: 5px;
      top: 5px;
      border: none;
      background-color: transparent;
      cursor: pointer;
      font-size: 20px;
    }
    
    .button-group button {
      padding: 10px 15px;
      margin-right: 5px;
      border: 1px solid #ccc;
      background-color: #f9f9f9;
      cursor: pointer;
    }
    
    .button-group button:hover {
      background-color: #eee;
    }
</style>
<body>

  <div class="form-group">    
      <label for="no">No
          <span style="color: red;">*</span>
      </label>    
      <div class="number-input">      
          <input type="text" id="no" value="312">      
          <button>-</button>      <button>+</button>    
      </div>  
  </div>
  <div class="form-group">    
      <label for="date">年月日
          <span style="color: red;">*</span>
      </label>    
      <div class="date-input">      
          <input type="text" id="date" value="2025/04/14">      
          <button> </button>    
      </div>  
  </div>
  <div class="form-group">    
      <label for="location">どこで</label>    
      <input type="text" id="location">  
  </div>
  <div class="form-group">    
      <label for="amount">金額
          <span style="color: red;">*</span>
      </label>    
      <div class="number-input">      
          <input type="text" id="amount" value="0">      
          <button>-</button>      
          <button>+</button>    
      </div>  
  </div>
        
  <div class="form-group">    
      <label>使い道
          <span style="color: red;">*</span>
      </label>    
      <div class="button-group">      
          <button>買い物</button>      
          <button>外食</button>      
          <button>その他娯楽</button>    
      </div>  
  </div>
    
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script>
        
        $(document).ready(function () {
            const liffId = "2007258385-PVNlrM0q";
            initializeLiff(liffId);
        })

        function initializeLiff(liffId) {
            liff.init({
                liffId: liffId
            }).then(() => {
                initializeApp();
            }).catch((err) => {
                console.log('LIFF Initialization failed ', err);
            });
        }

        function sendText(text) {
            liff.sendMessages([{
                'type': 'text',
                'text': text
            }]).then(function () {
                liff.closeWindow();
            }).catch(function (error) {
                window.alert('Failed to send message ' + error);
            });
        }
        
        const params = (new URL(document.location)).searchParams;
        const key = params.get('key');

        $(function () {
            $('form').submit(function () {
                const name    = $('input[name="name"]').val();
                const udetate = $('input[name="udetate"]').val();
                const fukkin  = $('input[name="fukkin"]').val();
                const haikin  = $('input[name="haikin"]').val();
                const sukuwat = $('input[name="sukuwat"]').val();
                const msg = `${name}\n${udetate}\n${fukkin}\n${haikin}\n${sukuwat}`;
                sendText(msg);
                return false;
            });
        });

    </script>

</body>
</html>
